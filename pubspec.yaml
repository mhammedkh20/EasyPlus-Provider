name: easy_plus_service_provider
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.12+23

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  bloc: ^8.1.1
  flutter_bloc: ^8.1.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.0
  flutter_svg: ^2.0.2
  country_pickers: ^2.0.0
  pinput: ^2.2.21
  stop_watch_timer: ^2.0.0
  image_picker: ^0.8.6+4
  # date_time_picker: ^2.1.0
  dotted_dashed_line: ^0.0.3
  lottie: ^2.2.0
  bottom_sheet: ^3.1.2
  flutter_rating_bar: ^4.0.1
  dio: ^5.1.1
  shared_preferences: ^2.1.0
  http: ^0.13.5
  cached_network_image: ^3.2.3
  custom_refresh_indicator: ^2.0.1
  mockito: ^5.4.0
  build_runner: ^2.3.3
  octo_image: ^1.0.2
  connectivity_plus: ^2.3.5
  url_launcher: ^6.1.10
  map_launcher: ^2.5.0+1
  flutter_staggered_animations: ^1.1.1
  flutter_clickpay_bridge: ^2.3.0
  geolocator: ^9.0.2
  geocoding: ^2.1.0
  firebase_core: ^2.13.1
  firebase_messaging: ^14.6.2
  google_maps_flutter: ^2.2.8
  flutter_local_notifications: ^9.9.1
  cloud_firestore: ^4.6.0
  package_info_plus: ^4.0.0
  firebase_remote_config: ^4.1.0
  selectable_autolink_text: ^2.6.0
  flutter_cache_manager: ^3.3.1
  custom_info_window: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_screenutil: ^5.6.1
  flutter_launcher_icons: "^0.12.0"

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21


flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/ic_settings/
    - assets/images/arrows/
    - assets/images/ic_social/
    - assets/images/ic_json/
    - assets/images/ic_service_main/
    - assets/images/ic_bottom_nav/


  fonts:
    - family: ubuntu
      fonts:
        - asset: assets/fonts/ubuntu/Ubuntu-Regular.ttf
        - asset: assets/fonts/ubuntu/Ubuntu-Light.ttf
          weight: 300
        - asset: assets/fonts/ubuntu/Ubuntu-Medium.ttf
          weight: 500
        - asset: assets/fonts/ubuntu/Ubuntu-Bold.ttf
          weight: 700

    - family: Montserrat
      fonts:
        - asset: assets/fonts/montasrat/Montserrat-Arabic Regular 400.otf
          weight: 400
        - asset: assets/fonts/montasrat/Montserrat-Arabic Black 900.otf
          weight: 900
        - asset: assets/fonts/montasrat/Montserrat-Arabic Bold 700.otf
          weight: 700
        - asset: assets/fonts/montasrat/Montserrat-Arabic ExtraBold 800.otf
          weight: 800
        - asset: assets/fonts/montasrat/Montserrat-Arabic SemiBold 600.otf
          weight: 600
        - asset: assets/fonts/montasrat/Montserrat-Arabic Medium 500.otf
          weight: 500
        - asset: assets/fonts/montasrat/Montserrat-Arabic Light 300.otf
          weight: 300